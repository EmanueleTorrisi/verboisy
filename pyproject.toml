[project]
name = "verboisy"
version = "1.0.0"
description = "Evidence-backed research and data extraction with portable provenance."
readme = "README.md"
license = "LicenseRef-Verboisy-Source-Inspection-1.0"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Emanuele Torrisi", email = "emanueletorrisi98@gmail.com" },
]
dynamic = ["classifiers"]
dependencies = [
    "pydantic>=2.7.1,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "playwright>=1.61.0,<1.62.0",
    "litellm>=1.101.0,<2.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "typer>=0.27.2,<0.28.0",
    "rich>=13.7.1,<14.0.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "structlog>=24.1.0,<25.0.0",
    "colorama>=0.4.6,<0.5.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "jsonschema[format-nongpl]>=4.23,<5.0.0",
    "filelock>=3.20,<4.0",
    "rfc3986-validator>=0.1.1,<0.2.0",
    "httpx>=0.28.1,<0.29.0",
    "httpcore>=1.0.9,<1.1.0",
    "aiohttp>=3.14.3,<4.0",
]

[project.scripts]
verboisy = "verboisy.cli.main:app"

[tool.poetry]
packages = [{ include = "verboisy", from = "src" }]
include = ["src/verboisy/py.typed"]
classifiers = ["Typing :: Typed", "License :: Other/Proprietary License"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.14.0"
mypy = "^1.10.0"
ruff = "^0.4.4"
mkdocs-material = "^9.5.21"
pytest-cov = "^7.1.0"
build = "^1.2"
pip-audit = "^2.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: real Chromium and local HTTP integration",
    "live: real model provider; explicitly opt in",
    "native: optional compiled quote matcher; requires a local native build",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "A",
    "C4",
    "SIM",
    "ARG",
    "PTH",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]
"tests/integration/test_browser_e2e.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
