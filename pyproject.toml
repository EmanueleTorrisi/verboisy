[tool.poetry]
name = "verboisy"
version = "0.1.0"
description = "Autonomous web research and structured scrape-to-JSON agent."
authors = ["Emanuele Torrisi <emanueletorrisi98@gmail.com>"]
readme = "README.md"
packages = [{include = "verboisy", from = "src"}]
include = ["src/verboisy/py.typed"]
classifiers = ["Typing :: Typed"]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
playwright = "^1.43.0"
litellm = "^1.37.16"
beautifulsoup4 = "^4.12.3"
typer = {extras = ["all"], version = "^0.12.3"}
rich = "^13.7.1"
aiosqlite = "^0.20.0"
structlog = "^24.1.0"
colorama = "^0.4.6"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = ">=0.23.6,<1.5.0"
pytest-mock = "^3.14.0"
mypy = "^1.10.0"
ruff = "^0.4.4"
mkdocs-material = "^9.5.21"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
verboisy = "verboisy.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
