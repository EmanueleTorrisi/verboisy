repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff
        name: Ruff from the project lockfile
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format from the project lockfile
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: mypy
        name: Mypy from the project lockfile
        entry: poetry run mypy src
        language: system
        pass_filenames: false
        types: [python]
