services:
  verboisy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      SQLITE_DB_PATH: /data/verboisy.db
      VERBOISY_HEADLESS: "true"
    volumes:
      - verboisy-data:/data
    init: true
    command: ["sleep", "infinity"]

volumes:
  verboisy-data:
