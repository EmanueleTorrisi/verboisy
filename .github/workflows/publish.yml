name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    if: vars.RELEASE_ENABLED == 'true' && github.event.repository.private == false
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install poetry==2.5.1
      - name: Verify release tag
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match package version"
          PY
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
