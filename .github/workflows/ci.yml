name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_call:

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} Python ${{ matrix.python }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: macos-latest, python: "3.11"}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Check lockfile
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy src

      - name: Run tests with 100% coverage
        run: poetry run pytest -m "not browser and not live" --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' &&
          matrix.python == '3.11' &&
          github.event_name == 'push'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

  native:
    name: Native C++ ${{ matrix.os }} Python ${{ matrix.python }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.11"}
          - {os: macos-latest, python: "3.14"}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Check lockfile
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install

      - name: Record compiler
        run: c++ --version

      - name: Build production native module
        run: poetry run python scripts/build_native.py

      - name: Build direct C++ tests
        run: poetry run python scripts/build_native_tests.py

      - name: Require passing native tests without skips
        run: poetry run python scripts/check_native_tests.py

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/native/native-test-results.xml
            build/native/quote-build.json
            build/native/quote-tests-build.json
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Real Chromium integration tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      - name: Install Chromium and system dependencies
        run: poetry run playwright install --with-deps chromium

      - name: Run browser integration tests
        run: poetry run pytest -m browser -v
        env:
          VERBOISY_REQUIRE_BROWSER: "1"
          # GitHub-hosted Ubuntu runners do not expose a usable Chromium
          # Linux sandbox. Production keeps BROWSER_SANDBOX=true.
          TEST_BROWSER_SANDBOX: "false"

  build:
    name: Build and validate package

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      - name: Check lockfile
        run: poetry check --lock

      - name: Security audit
        run: poetry run pip-audit --local

      - name: Build documentation
        run: poetry run mkdocs build --strict

      - name: Build distribution
        run: poetry build

      - name: Check installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/verboisy-wheel"

          "$RUNNER_TEMP/verboisy-wheel/bin/python" -m pip install --upgrade pip setuptools
          "$RUNNER_TEMP/verboisy-wheel/bin/python" \
            -m pip install dist/*.whl

          "$RUNNER_TEMP/verboisy-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"

          "$RUNNER_TEMP/verboisy-wheel/bin/python" \
            -c "from verboisy.browser.context import BrowserManager; print('BrowserManager import OK')"

          "$RUNNER_TEMP/verboisy-wheel/bin/python" \
            -m verboisy --help

      - name: Upload tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker build and Chromium smoke test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t verboisy:ci .

      - name: Test Verboisy CLI
        run: |
          docker run --rm \
            --entrypoint verboisy \
            verboisy:ci \
            --help

      - name: Test sandboxed Verboisy browser inside Docker
        run: |
          docker run --rm -i \
            --init \
            --shm-size=1g \
            --security-opt seccomp=docker/seccomp_profile.json \
            --entrypoint python \
            verboisy:ci - <<'PY'
          import asyncio
          import os
          from verboisy.browser.context import BrowserManager
          from verboisy.utils.config import Settings

          async def main():
              assert os.geteuid() != 0, "Browser must run as a non-root user"
              manager = BrowserManager(Settings(_env_file=None))
              assert manager.config.browser_sandbox, "Default sandbox must be enabled"
              try:
                  page = await manager.start()
                  await page.set_content("<title>Verboisy sandbox check</title>")
                  assert await page.title() == "Verboisy sandbox check"
                  print("Sandboxed Verboisy browser OK")
              finally:
                  await manager.close()

          asyncio.run(main())
          PY
