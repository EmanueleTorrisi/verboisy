
name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} Python ${{ matrix.python }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: macos-latest, python: "3.11"}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Check lockfile
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy src

      - name: Run tests with 100% coverage
        run: poetry run pytest -m "not browser" --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' &&
          matrix.python == '3.11' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

  browser:
    name: Real Chromium integration tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      - name: Install Chromium and system dependencies
        run: poetry run playwright install --with-deps chromium

      - name: Run browser integration tests
        run: poetry run pytest -m browser -v
        env:
          VERBOISY_REQUIRE_BROWSER: "1"

  build:
    name: Build and validate package

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      - name: Check lockfile
        run: poetry check --lock

      - name: Security audit
        run: poetry run pip-audit --local

      - name: Build documentation
        run: poetry run mkdocs build --strict

      - name: Build distribution
        run: poetry build

      - name: Check installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/verboisy-wheel"

          "$RUNNER_TEMP/verboisy-wheel/bin/python" \
            -m pip install dist/*.whl

          cd "$RUNNER_TEMP"

          "$RUNNER_TEMP/verboisy-wheel/bin/python" \
            -c "from verboisy.browser.context import BrowserManager; print('BrowserManager import OK')"

          "$RUNNER_TEMP/verboisy-wheel/bin/python" \
            -m verboisy --help

  docker:
    name: Docker build and Chromium smoke test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t verboisy:ci .

      - name: Test Verboisy CLI
        run: |
          docker run --rm \
            --entrypoint verboisy \
            verboisy:ci \
            --help

      - name: Test Chromium inside Docker
        run: |
          docker run --rm \
            --init \
            --shm-size=1g \
            --entrypoint python \
            verboisy:ci \
            -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); print('Chromium OK'); b.close(); p.stop()"
