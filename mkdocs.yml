site_name: Verboisy
site_description: Evidence-backed research and data extraction with portable provenance.
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
nav:
  - Home: index.md
  - Installation: installation.md
  - Release qualification: release.md
  - Publishing and customer delivery: distribution.md
  - Licensing: licensing.md
  - Demos and enterprise: commercial.md
  - CLI: cli.md
  - Model providers: providers.md
  - Display preferences: presentation.md
  - Research semantics: research-semantics.md
  - Dataset contract: contracts.md
  - Dataset ingestion: ingestion.md
  - File capabilities: formats.md
  - Large local datasets: streaming.md
  - Product roadmap: development-roadmap.md
  - SmartID: smartid.md
  - Proof and provenance: proof.md
  - API: api.md
  - Architecture: architecture.md
  - CPU and memory benchmarks: benchmarks.md
  - Optional native matcher: native.md
  - Search and recovery: search-and-recovery.md
  - Validation: validation.md
  - Migration: migration.md
  - Workflows and examples: examples.md
  - Evaluation: evaluation.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
